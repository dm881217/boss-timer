<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炭炭打王小工具</title>
    <style>
        :root { --bg: #0f0f0f; --card: #1e1e1e; --accent: #f39c12; }
        body { background: var(--bg); color: #eee; font-family: 'Helvetica Neue', sans-serif; margin: 0; padding: 10px; }
        .boss-card { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .card-title { color: var(--accent); font-size: 1.2rem; font-weight: bold; margin-bottom: 12px; border-left: 4px solid var(--accent); padding-left: 10px; }
        
        /* 修改此處，強制每行排列 3 個 */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
            margin-bottom: 10px; 
        }

        .skill-btn { background: #2a2a2a; border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; border: 1px solid #333; transition: 0.2s; }
        .skill-btn.active { border-color: #27ae60; background: #1a3324; }
        .skill-name { font-size: 0.8rem; }
        .skill-time { font-size: 1rem; font-weight: bold; }
        .status-bar { width: 100%; height: 35px; border-radius: 8px; margin-top: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: bold; transition: 0.3s; }
    </style>
</head>

</body>
</html>
